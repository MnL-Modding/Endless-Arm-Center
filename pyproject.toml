[project]
name = "endless_arm_center"
version = "1.0.0-dev"
description = "Patcher for an endless mode for Arm Center in Bowser's Inside Story"
authors = [
    {name = "ThePurpleAnon"}
]
license = {text = "GPL-3.0-or-later"}
readme = "README.md"
requires-python = ">=3.12,<3.16"
dependencies = [
    "mnlscript (>=0.2.5,<0.3.0)",
    "ndspy (>=4.2.0,<5.0.0)",
    "mnllib (>=0.2.3,<0.3.0)",
    "pyside6 (>=6.12.0,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
